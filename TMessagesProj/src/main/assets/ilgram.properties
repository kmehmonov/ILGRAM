# ILGRAM configuration (prototype: bundled in the APK).
#
# Every key can be overridden at runtime through Android "managed configuration"
# (app restrictions) pushed by the MDM / Device Owner — no APK rebuild needed.
# Keys and formats are the same in both places.
#
# These are USER INTERFACE restrictions of the ILGRAM app only. They do not change
# the account's real permissions on Telegram's servers.

# Master switch for the restricted student UI.
student_mode_enabled=true

# Allowed school groups, by Telegram chat ID (never by name).
# Accepted formats: Bot API ids (-1001234567890 for supergroups/channels, -123456789 for basic groups)
# or channel:1234567890 / chat:123456789. Separate with commas.
allowed_group_ids=

# Allowed people for private chats, by Telegram user ID (not username, not phone). Comma-separated.
allowed_user_ids=

# Show "Telegram" service notifications (login codes, security alerts). Read-only.
allow_service_notifications=true

# Secret (end-to-end) chats with allowed users.
allow_secret_chats=false

# Everything below stays false for students.
browser_enabled=false
global_search_enabled=false
multi_account_enabled=false

# Optional text for Settings -> ILGRAM -> Yordam (use \n for new lines).
help_text=
