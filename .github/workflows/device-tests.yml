name: ILGRAM device tests

# Builds the instrumentation test app (x86_64) and runs ILGRAM's integration + smoke tests
# on an Android emulator. No Telegram account is needed for these tests.
on:
  push:
    branches: [ master ]
    paths: [ 'TMessagesProj/src/**', 'TMessagesProj_AppTests/**', 'ilgram/**', '.github/workflows/device-tests.yml' ]
  workflow_dispatch:

concurrency:
  group: device-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      NDK_VERSION: 27.2.12479018
      CMAKE_VERSION: 3.22.1
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          df -h /

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;${NDK_VERSION}" "cmake;${CMAKE_VERSION}" "build-tools;36.0.0" "platforms;android-36" > /dev/null

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ndk-x86_64-debug-${{ env.NDK_VERSION }}
          max-size: 3G

      - uses: gradle/actions/setup-gradle@v4

      - name: Build test app (x86_64)
        env:
          ILGRAM_CCACHE: '1'
        run: |
          ./gradlew --no-daemon -PilgramAbis=x86_64 :TMessagesProj_AppTests:assembleAfatDebug :TMessagesProj_AppTests:assembleAfatDebugAndroidTest
          find TMessagesProj_AppTests/build/outputs/apk -name '*.apk' -exec ls -la {} \;

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run tests on emulator (API 34)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash ilgram/ci/run-device-tests.sh

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ILGRAM-device-tests-${{ github.run_number }}
          path: device-test-results/
          if-no-files-found: warn
