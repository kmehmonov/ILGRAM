name: ILGRAM build

on:
  push:
    branches: [ master ]
    paths-ignore: [ 'docs/**', '**.md' ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      NDK_VERSION: 27.2.12479018
      CMAKE_VERSION: 3.22.1
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          sudo docker image prune --all --force || true
          df -h /

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;${NDK_VERSION}" "cmake;${CMAKE_VERSION}" "build-tools;36.0.0" "platforms;android-36" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> $GITHUB_ENV

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ndk-${{ env.NDK_VERSION }}
          max-size: 4G

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (ILGRAM policy rules, plain JVM)
        run: bash ilgram/tests/run-tests.sh

      - name: Build APK
        env:
          ILGRAM_CCACHE: '1'
          ILGRAM_API_ID: ${{ secrets.ILGRAM_API_ID }}
          ILGRAM_API_HASH: ${{ secrets.ILGRAM_API_HASH }}
          ILGRAM_KEYSTORE_B64: ${{ secrets.ILGRAM_KEYSTORE_B64 }}
          ILGRAM_KEYSTORE_PASSWORD: ${{ secrets.ILGRAM_KEYSTORE_PASSWORD }}
          ILGRAM_KEY_ALIAS: ${{ secrets.ILGRAM_KEY_ALIAS }}
          ILGRAM_KEY_PASSWORD: ${{ secrets.ILGRAM_KEY_PASSWORD }}
          ILGRAM_CONFIG: ${{ secrets.ILGRAM_CONFIG }}
        run: |
          . ilgram/ci/prepare.sh
          ./gradlew --no-daemon --stacktrace :TMessagesProj_App:assembleAfatRelease
          ccache -s || true

      - name: Rename APK
        run: |
          APK=$(find TMessagesProj_App/build/outputs/apk -name '*.apk' | head -1)
          mkdir -p out && cp "$APK" "out/ILGRAM-${{ github.run_number }}.apk"
          sha256sum out/*.apk | tee out/SHA256SUMS.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs out/*.apk | head -5 || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ILGRAM-apk-${{ github.run_number }}
          path: out/*
          if-no-files-found: error
